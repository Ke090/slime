<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#fff8e8" />
    <title>ぷにょぷにょスライム</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-label="ぷにょぷにょスライム">
      <div class="sky-decor" aria-hidden="true">
        <span class="cloud cloud-one"></span><span class="cloud cloud-two"></span>
        <span class="sparkle sparkle-one">✦</span><span class="sparkle sparkle-two">✦</span>
      </div>

      <header class="topbar">
        <button class="round-button" id="soundButton" aria-label="音を消す" aria-pressed="false">
          <span id="soundIcon" aria-hidden="true">♪</span>
        </button>
        <div class="logo" aria-hidden="true"><span>ぷにょ</span><span>ぷにょ</span></div>
        <button class="round-button" id="resetButton" aria-label="スライムを元に戻す">
          <span aria-hidden="true">↻</span>
        </button>
      </header>

      <section class="playground" id="playground" aria-label="スライムを触って遊ぶ場所">
        <canvas id="slimeCanvas"></canvas>
        <div class="touch-hint" id="touchHint" aria-hidden="true">
          <span class="hint-hand">☝</span><span>さわってみてね</span>
        </div>
      </section>

      <nav class="modes" aria-label="スライムの種類">
        <button class="mode active" data-mode="jelly" aria-pressed="true">
          <span class="mode-icon jelly-icon" aria-hidden="true"><i></i><i></i></span>
          <span>ぷるぷる</span>
        </button>
        <button class="mode" data-mode="sticky" aria-pressed="false">
          <span class="mode-icon sticky-icon" aria-hidden="true"><i></i><i></i></span>
          <span>ねばねば</span>
        </button>
        <button class="mode" data-mode="mochi" aria-pressed="false">
          <span class="mode-icon mochi-icon" aria-hidden="true"><i></i><i></i></span>
          <span>もちもち</span>
        </button>
      </nav>
    </main>
    <script src="game.js"></script>
  </body>
</html>
